name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CSS lint (oklch enforcement)
        run: bash scripts/lint-css.sh

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  batch-scripts-windows:
    name: Batch Scripts (PowerShell & cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run generated script integration tests
        run: npm run test -- tests/ffmpeg/batch-integration.test.ts -t CC4-04
